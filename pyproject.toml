[project]
name = "pacman"
version = "0.1.0"
description = "Ghosts! More ghosts!"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "mazegenerator",
    "pydantic>=2.13.3",
    "raylib>=5.5.0.4",
    "setuptools>=82.0.1",
]

[tool.uv.sources]
mazegenerator = {path = "lib/mazegenerator-2.0.1-py3-none-any.whl"}

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.2",
]

[tool.mypy]
exclude = [
    '.venv',
]